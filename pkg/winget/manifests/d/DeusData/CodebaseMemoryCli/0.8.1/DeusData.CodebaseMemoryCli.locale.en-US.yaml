ShortDescription: Fast code intelligence engine for AI coding agents
Description: |-
  codebase-memory-cli is a CLI-first native code-intelligence application
  distributed as a verified runtime set. It builds and queries a persistent local
  structural index for repository search, source retrieval, call tracing, coverage,
  architecture, and related code-intelligence workflows. It is designed for direct
  shell use and coding-agent runners and does not expose a supported MCP stdio server.
